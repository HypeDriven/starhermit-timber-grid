<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b2119" />
<title>Timber Grid</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #2b2119; --panel: #3a2d22; --panel2: #463727; --text: #f5efe6; --accent: #e0a458;
    --chip: #54402e; --focus: #ffd27a;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
    overflow: hidden; touch-action: none;
  }
  body.large-text { font-size: 120%; }
  body.high-contrast { --bg: #000; --panel: #111; --panel2: #1a1a1a; --text: #fff; --accent: #ffd24a; --chip: #222; }

  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

  #statusbar {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: calc(0.4rem + var(--sat)) calc(0.6rem + var(--sar)) 0.4rem calc(0.6rem + var(--sal));
    background: var(--panel); min-height: 2.6rem;
  }
  .brand { font-size: 1.05rem; margin: 0 auto 0 0; letter-spacing: 0.04em; }
  .hud-chip { background: var(--chip); border-radius: 0.5rem; padding: 0.25rem 0.6rem; font-size: 0.9rem; min-height: 1.8rem; }
  .hud-chip:empty { display: none; }

  #game-region { position: relative; flex: 1; min-height: 0; display: flex; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .rail {
    position: relative; z-index: 2; width: 13rem; max-width: 34vw; padding: 0.6rem;
    display: flex; flex-direction: column; gap: 0.6rem; pointer-events: none;
  }
  #rail-left { margin-right: auto; }
  #rail-right { margin-left: auto; align-items: flex-end; }
  .rail-block { background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: 0.6rem; padding: 0.55rem 0.7rem; pointer-events: auto; max-width: 70ch; }
  .rail-block h3 { margin: 0 0 0.25rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
  .rail-block p { margin: 0; font-size: 0.9rem; }
  .rail-block.actions { display: flex; gap: 0.5rem; }
  .tutorial-card { background: var(--panel2); border-left: 3px solid var(--accent); border-radius: 0.4rem; padding: 0.6rem 0.7rem; pointer-events: auto; }
  .tutorial-card p { margin: 0.3rem 0 0; font-size: 0.9rem; }

  button { font: inherit; color: inherit; cursor: pointer; }
  .chip-btn {
    background: var(--chip); border: 1px solid transparent; border-radius: 0.5rem;
    min-height: 44px; min-width: 44px; padding: 0.35rem 0.8rem;
  }
  .chip-btn:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #tray {
    display: flex; justify-content: center; gap: 1.2rem; align-items: center;
    padding: 0.6rem calc(0.6rem + var(--sar)) calc(0.6rem + var(--sab)) calc(0.6rem + var(--sal));
    background: var(--panel); min-height: 5.2rem;
  }
  body.left-handed #tray { flex-direction: row-reverse; }
  .tray-piece {
    background: var(--chip); border: 2px solid transparent; border-radius: 0.6rem;
    padding: 0.5rem; min-width: 64px; min-height: 64px; touch-action: none;
  }
  .tray-piece.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent); }
  .piece-grid { display: grid; gap: 3px; }
  .piece-cell { width: 16px; height: 16px; border-radius: 3px; display: block; }
  .piece-cell.on { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); }

  .overlay-veil {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 7, 5, 0.6); padding: 1rem; overflow: auto;
  }
  .panel {
    background: var(--panel); border-radius: 0.9rem; padding: 1.4rem 1.6rem;
    width: min(30rem, 94vw); max-height: 92dvh; overflow: auto;
    display: flex; flex-direction: column; gap: 0.55rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.5);
  }
  .panel h2 { margin: 0 0 0.3rem; }
  .panel h3 { margin: 0.5rem 0 0; color: var(--accent); }
  .tagline { margin: 0 0 0.6rem; opacity: 0.85; }
  .menu-btn {
    background: var(--panel2); border: 1px solid transparent; border-radius: 0.6rem;
    padding: 0.7rem 1rem; text-align: left; min-height: 44px; font-size: 1rem;
  }
  .menu-btn:hover { border-color: var(--accent); }
  .menu-btn.primary { background: var(--accent); color: #241a10; font-weight: 600; }
  .big-score { font-size: 1.6rem; font-weight: 700; margin: 0.2rem 0; }
  .reason { opacity: 0.85; margin: 0; }
  .score-table { border-collapse: collapse; width: 100%; }
  .score-table td, .score-table th { padding: 0.25rem 0.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .ranked-line { font-size: 0.85rem; color: var(--accent); margin: 0; }
  .panel ul { margin: 0; padding-left: 1.2rem; }
  .help-card { background: var(--panel2); border-radius: 0.6rem; padding: 0.6rem 0.8rem; }
  .help-card p { margin: 0.25rem 0 0; font-size: 0.92rem; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 44px; }
  .setting-row input[type="range"] { width: 10rem; }
  .setting-row select { font: inherit; background: var(--panel2); color: var(--text); border-radius: 0.4rem; padding: 0.3rem 0.5rem; min-height: 40px; }

  .sr-only {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important;
  }
  /* Accessible fallback board when WebGL is unavailable. */
  #board-mirror.board-visible {
    position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; gap: 0;
    clip: auto !important; width: auto !important; height: auto !important; margin: 0 !important;
  }
  #board-mirror.board-visible > div { display: flex; }
  .mirror-cell { width: 34px; height: 34px; margin: 1px; background: #c9a26b; border: 1px solid #8a6a44; border-radius: 4px; }
  .mirror-cell.filled { background: #7a4a22; }
  #board-mirror.board-visible .mirror-cell.ghost { outline: 2px solid var(--focus); outline-offset: -2px; }
  #board-mirror.board-visible .mirror-cell.ghost-invalid { outline: 2px solid #c03030; outline-offset: -2px; }
  #board-mirror.board-visible .mirror-cell.cursor { box-shadow: 0 0 0 2px var(--accent); }
  #board-mirror:not(.board-visible) .mirror-cell { width: 1px; height: 1px; padding: 0; border: 0; }

  /* Compact: rails become less intrusive; portrait: tray is the thumb zone. */
  @media (max-width: 1023px) {
    .rail { width: auto; max-width: 60vw; position: absolute; top: 0.4rem; }
    #rail-left { left: 0.4rem; }
    #rail-right { right: 0.4rem; top: auto; bottom: 0.4rem; flex-direction: row; }
    .rail-block { font-size: 0.85rem; padding: 0.45rem 0.55rem; }
  }
  @media (orientation: portrait) {
    #tray { min-height: 6rem; }
    .piece-cell { width: 18px; height: 18px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #tray { min-height: 3.6rem; padding-top: 0.3rem; padding-bottom: calc(0.3rem + var(--sab)); }
    .tray-piece { min-height: 48px; min-width: 48px; padding: 0.3rem; }
    .piece-cell { width: 12px; height: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app" aria-busy="true"></div>
<noscript>Timber Grid requires JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
